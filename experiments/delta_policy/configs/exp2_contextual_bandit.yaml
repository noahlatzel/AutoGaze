id: exp2_contextual_bandit
family: delta_policy
status: completed
question: Test whether a trainable delta policy can optimize an explicit skip reward over logged all-action scores.
runner: scripts/runners/train_delta_bandit.py
environment: autogaze
dataset:
  name: autogaze_training_data_delta_labels
outputs:
  root: outputs/delta_bandit
command:
  features: outputs/delta_probe_features/autogaze_balanced5k_representations.pt
  labels_json: outputs/delta_labels/exp0b_siglip_balanced5k_train.json
  heuristic: siglip
  skip_bonus: 0.0025
  entropy_bonus: 0.01
  epochs: 80
  batch_size: 512
  device: cuda
grid:
  reward: "-score + skip_bonus * log(delta)"
  deltas: [1, 2, 4, 8, 16, 32]
  policies:
    - linear
    - mlp
  representations:
    - mean_vision
    - final_gaze
    - mean_gaze
    - final_frame_mean_gaze
  metadata_fields:
    - fps_bucket
    - effective_fps
    - frame_count
    - start
metrics:
  primary:
    - mean_reward
    - label_accuracy
    - mean_delta
    - mean_abs_delta_error
  secondary:
    - prediction_counts
    - fixed_delta baselines
notes:
  - research/rl/exp2c_contextual_bandit_smoke.md
runs:
  - id: exp2c_siglip_mean_vision_runtime_bucket_linear_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_mean_vision_runtime_bucket_linear_beta0025_metrics.json
    command:
      feature_key: mean_vision
      metadata_fields: fps_bucket,effective_fps,frame_count,start
      policy: linear
  - id: exp2c_siglip_mean_vision_runtime_linear_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_mean_vision_runtime_linear_beta0025_metrics.json
    command:
      feature_key: mean_vision
      metadata_fields: effective_fps,frame_count,start
      policy: linear
  - id: exp2c_siglip_mean_vision_runtime_mlp_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_mean_vision_runtime_mlp_beta0025_metrics.json
    command:
      feature_key: mean_vision
      metadata_fields: effective_fps,frame_count,start
      policy: mlp
  - id: exp2c_siglip_final_gaze_linear_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_final_gaze_linear_beta0025_metrics.json
    command:
      feature_key: final_gaze
      policy: linear
  - id: exp2c_siglip_mean_gaze_linear_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_mean_gaze_linear_beta0025_metrics.json
    command:
      feature_key: mean_gaze
      policy: linear
  - id: exp2c_siglip_final_frame_mean_gaze_linear_beta0025
    status: completed
    output: outputs/delta_bandit/exp2c_siglip_final_frame_mean_gaze_linear_beta0025_metrics.json
    command:
      feature_key: final_frame_mean_gaze
      policy: linear
