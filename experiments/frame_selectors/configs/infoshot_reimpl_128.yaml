notes:
  - Independent implementation of arXiv:2603.17374v1; it is not official InfoShot code.
  - One query-agnostic selection is computed per unique video and reused across HLVid questions.
  - Low-resolution ResNet features drive selection; the evaluator reloads selected source frames at full resolution.
  - Linear boundary-window scaling is an explicit local choice because the paper reports only the 3-15 range.
  - See research/frame_selectors_infoshot.md.
  - Submitted as job 1626645 on the general 48+ GB VRAM node pool.
