id: hlvid_hierarchical_coherence_dry_v0
family: hierarchical_sampling
status: planned
question: Can a parallelizable hierarchy of coherent temporal leaves replace sequential frame-skip rollout?
runner: scripts/runners/run_hierarchical_coherence_dry_sweep.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
outputs:
  root: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0
  summary: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/summary.json
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  tile_len: 16
  resize: 224
  target_leaf_tiles: 16
  max_depth: 5
  min_interval_frames: 64
  coherence_metric: semantic_diversity
  semantic_model: dinov2
  semantic_dtype: float16
  max_batch_size_semantic: 32
metrics:
  primary:
    - mean_leaf_tiles
    - mean_selected_frames
    - mean_leaf_depth
    - leaf_count_distribution
  secondary:
    - by_category
    - mean_leaf_score
    - selected_frame_ratio
notes:
  - research/hierarchical_coherent_tile_sampling.md
  - Low-resolution coherence scoring selects source-frame indices only; promoted AutoGaze/NVILA runs must reload selected frames from the original video.
runs:
  - id: hcs_dino_semdiv_8
    status: planned
    output_dir: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/dino_semdiv_8
    command:
      coherence_metric: semantic_diversity
      semantic_model: dinov2
      target_leaf_tiles: 8
  - id: hcs_dino_semdiv_16
    status: planned
    output_dir: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/dino_semdiv_16
    command:
      coherence_metric: semantic_diversity
      semantic_model: dinov2
      target_leaf_tiles: 16
  - id: hcs_dino_semdiv_32
    status: planned
    output_dir: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/dino_semdiv_32
    command:
      coherence_metric: semantic_diversity
      semantic_model: dinov2
      target_leaf_tiles: 32
  - id: hcs_dino_semnovel_16
    status: planned
    output_dir: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/dino_semnovel_16
    command:
      coherence_metric: semantic_mean_novelty
      semantic_model: dinov2
      target_leaf_tiles: 16
  - id: hcs_pixel_diversity_16
    status: planned
    output_dir: outputs/hierarchical_sampling/hlvid_hierarchical_coherence_dry_v0/pixel_diversity_16
    command:
      coherence_metric: within_diversity
      proxy_base_metric: pixel_mse
      target_leaf_tiles: 16
