id: hlvid_nvila_fixed_delta
family: hlvid_nvila
status: completed
question: Establish fixed inter-tile delta baselines for HLVid/NVILA.
runner: scripts/runners/evaluate_hlvid_nvila.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
models:
  nvila: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
outputs:
  root: outputs/hlvid/nvila_fixed_delta
  summary_glob: delta_*/summary.json
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  model_path: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze_model_id: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
  tile_len: 16
  max_new_tokens: 16
  max_batch_size_autogaze: 16
grid:
  delta_gap: [1, 2, 4, 8, 16, 32]
metrics:
  primary:
    - accuracy
    - visited_frame_count
    - mean_llm_inference_seconds
  secondary:
    - by_category
    - prediction_counts
notes:
  - research/rl/option_0_fixed_delta_evaluation.md
runs:
  - id: hlvid_nvila_fixed_delta_1
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_1
    command:
      delta_gap: 1
  - id: hlvid_nvila_fixed_delta_2
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_2
    command:
      delta_gap: 2
  - id: hlvid_nvila_fixed_delta_4
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_4
    command:
      delta_gap: 4
  - id: hlvid_nvila_fixed_delta_8
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_8
    command:
      delta_gap: 8
  - id: hlvid_nvila_fixed_delta_16
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_16
    command:
      delta_gap: 16
  - id: hlvid_nvila_fixed_delta_32
    status: completed
    output_dir: outputs/hlvid/nvila_fixed_delta/delta_32
    command:
      delta_gap: 32
