id: hlvid_nvila_hierarchical_temporal_density_128_mtv48
family: hlvid_nvila
status: submitted
slurm:
  submitted_at: "2026-07-05"
  state_at_submission: PD
  jobs:
    hlvid_hier_pixel_diversity_128_mtv48: 1615401
    hlvid_hier_dino_semdiv_128_mtv48: 1616017
  previous_jobs:
    hlvid_hier_dino_semdiv_128_mtv48: 1615400
    hlvid_hier_siglip_semdiv_128_mtv48: 1615399
    hlvid_hier_autogaze_density_128_mtv48: 1615398
runner: scripts/runners/evaluate_hlvid_nvila.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
models:
  nvila: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
question: Evaluate best-first hierarchical temporal-density frame sampling on HLVid/NVILA with num_video_frames=128 and max_tiles_video=48.
outputs:
  root: outputs/hlvid/hierarchical_temporal_density_128_mtv48
  summary_glob: "*/summary.json"
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  model_path: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze_model_id: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
  frame_source: hierarchical
  tile_len: 16
  max_tiles_video: 48
  num_video_frames: 128
  num_video_frames_thumbnail: 64
  hierarchical_target_leaf_tiles: 8
  hierarchical_split_policy: best_first
  hierarchical_max_depth: 5
  hierarchical_min_interval_frames: 64
  hierarchical_resize: 224
  hierarchical_semantic_dtype: float16
  hierarchical_max_batch_size_semantic: 32
  hierarchical_autogaze_dtype: float16
  hierarchical_autogaze_gazing_ratio: 0.75
  hierarchical_autogaze_task_loss_requirement: 0.7
  max_new_tokens: 16
  max_batch_size_autogaze: 16
  max_batch_size_siglip: 32
  torch_dtype: bfloat16
  resume: true
metrics:
  primary:
    - accuracy
    - mean_visited_frames
    - mean_visited_tiles
    - by_category
  secondary:
    - prediction_counts
    - visual_tokens
    - end_to_end_seconds
notes:
  - 128-frame variant of hierarchical temporal-density sampling; hierarchy selects 8 leaves of 16 frames each.
  - Coherence scoring uses 224px thumbnails only; NVILA receives reloaded selected source frames through the normal processor.
runs:
  - id: hlvid_hier_pixel_diversity_128_mtv48
    status: submitted
    slurm_job_id: 1615401
    output_dir: outputs/hlvid/hierarchical_temporal_density_128_mtv48/pixel_diversity
    command:
      hierarchical_coherence_metric: within_diversity
      hierarchical_proxy_base_metric: pixel_mse
  - id: hlvid_hier_dino_semdiv_128_mtv48
    status: resubmitted_after_timeout
    slurm_job_id: 1616017
    previous_slurm_job_id: 1615400
    output_dir: outputs/hlvid/hierarchical_temporal_density_128_mtv48/dino_semdiv
    command:
      hierarchical_coherence_metric: semantic_diversity
      hierarchical_semantic_model: dinov2
  - id: hlvid_hier_siglip_semdiv_128_mtv48
    status: submitted
    slurm_job_id: 1615399
    output_dir: outputs/hlvid/hierarchical_temporal_density_128_mtv48/siglip_semdiv
    command:
      hierarchical_coherence_metric: semantic_diversity
      hierarchical_semantic_model: siglip
  - id: hlvid_hier_autogaze_density_128_mtv48
    status: submitted
    slurm_job_id: 1615398
    output_dir: outputs/hlvid/hierarchical_temporal_density_128_mtv48/autogaze_gaze_density
    command:
      hierarchical_coherence_metric: autogaze_gaze_density
      hierarchical_autogaze_gazing_ratio: 0.75
      hierarchical_autogaze_task_loss_requirement: 0.7
