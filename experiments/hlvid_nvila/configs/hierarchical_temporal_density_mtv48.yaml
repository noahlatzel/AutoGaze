question: Evaluate best-first hierarchical temporal-density frame sampling on HLVid/NVILA with max_tiles_video=48.
runner: scripts/runners/evaluate_hlvid_nvila.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
models:
  nvila: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
outputs:
  root: outputs/hlvid/hierarchical_temporal_density_mtv48
  summary_glob: "*/summary.json"
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  model_path: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--NVILA-8B-HD-Video
  autogaze_model_id: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
  frame_source: hierarchical
  tile_len: 16
  max_tiles_video: 48
  num_video_frames: 256
  num_video_frames_thumbnail: 64
  hierarchical_target_leaf_tiles: 16
  hierarchical_split_policy: best_first
  hierarchical_max_depth: 5
  hierarchical_min_interval_frames: 64
  hierarchical_resize: 224
  hierarchical_semantic_dtype: float16
  hierarchical_max_batch_size_semantic: 32
  hierarchical_autogaze_dtype: float16
  hierarchical_autogaze_gazing_ratio: 0.75
  hierarchical_autogaze_task_loss_requirement: 0.7
  max_new_tokens: 16
  max_batch_size_autogaze: 16
  max_batch_size_siglip: 32
  torch_dtype: bfloat16
  resume: true
metrics:
  primary:
    - accuracy
    - mean_visited_frames
    - mean_visited_tiles
    - by_category
  secondary:
    - prediction_counts
    - visual_tokens
    - end_to_end_seconds
    - hierarchical leaf depth distribution
    - hierarchical source-frame distribution
notes:
  - Same five-sampler comparison as hierarchical_temporal_density_mtv1, with max_tiles_video=48.
  - Coherence scoring uses 224px thumbnails only; NVILA receives reloaded selected source frames through the normal processor.
