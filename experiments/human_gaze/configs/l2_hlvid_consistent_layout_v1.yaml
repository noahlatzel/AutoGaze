schema_version: 1
experiment_id: l2_hlvid_consistent_layout
gate: L2
title: Gaze HLVid rerun with a processor layout that matches the vision tower
status: frozen_before_inference
date: '2026-11-10'
authorization:
  user: Noah Latzel
  date: '2026-11-10'
  scope: rerun of the minimal Study III HLVid set (Center16, Random16, pretrained fine-only, two trained seeds)
    with the consistent processor layout, plus dependent CPU curation
  training_authorized: false
  human_gaze_protected_test_accessed: false
question: 'With the processor addressing patches in the vision tower''s layout, so that the selected cells are the
  encoded patches: (1) does a compact central block beat random cells on HLVid, and (2) does the gaze-trained fine-cell
  policy beat the central block?'
background: L1 step 1 showed that under the released processor default the tower gathers the intended patch for
  under 1% of the selected positions. Every earlier HLVid run of Study III therefore compared displaced selections.
  See wiki/experiments/L1 Patch Layout Consistency.md.
