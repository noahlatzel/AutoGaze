  preflight: question 0 per arm; Random16 actions recomputed from the seed for every tile-frame
analysis:
  primary_metric: question_micro_accuracy
  primary_contrasts:
    floor:
      contrast: center16 minus random16
      decision_rule:
        compact_block_better: 90% lower bound > 0
        random_better: 90% upper bound < 0
        unresolved: otherwise (no equivalence claim)
    gaze:
      contrast: mean of the two trained seeds minus center16
      decision_rule:
        gaze_trained_better: 90% lower bound > 0
        center16_better: 90% upper bound < 0
        unresolved: otherwise (no equivalence claim)
  uncertainty: paired 77-video cluster bootstrap; for the gaze contrast the per-question correctness of the two
    seeds is averaged first, so the interval is conditional on these two seeds
  bootstrap_iterations: 10000
  bootstrap_seed: 20261110
  confidence_level: 0.9
  secondary:
  - macro_video_accuracy versions of both primaries (same bootstrap draws)
  - pretrained minus center16; trained minus pretrained; trained minus random16; pretrained minus random16
  - per-seed accuracy of the two trained policies and their answer-letter disagreement
  - answer-letter disagreement between arms
  - each arm against the same arm under the released layout (descriptive; other jobs and partly other hardware)
  - visual tokens per question; share of selected cells inside the central block per arm (from saved actions)
  missing_data: each primary needs all 268 questions in its arms; no outcome-dependent exclusions
  hardware_rule: all arms request the same GPU model (A40); curation reports the GPU of every arm and marks any
    contrast whose arms differ
