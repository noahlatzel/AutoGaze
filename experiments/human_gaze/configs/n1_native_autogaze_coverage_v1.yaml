analysis:
  coverage: per frame, normalised attention mass inside the pixel union of the selected patches (any scale); frames -> clips -> videos -> equal-weight sources
  primary_contrast: trained RL K16 six-seed mean minus native16, source-macro coverage
  uncertainty: paired source-stratified video bootstrap (source_stratified_video_bootstrap_delta), seed-averaged
  bootstrap_iterations: 10000
  bootstrap_seed: 20261108
  confidence: 0.90
  decision_rule:
    trained_better: 90% lower bound > 0
    native_better: 90% upper bound < 0
    inconclusive: otherwise; no equivalence claim
  implementation_check:
    rule: pixel-union scorer reproduces GT1 source-macro test values for the fine-only arms within 1e-6 (exact values from gt1_metrics; the gate note quotes them rounded to 5 decimals)
    targets: {rl_six_seed_mean: 0.44301112915277024, center16: 0.3616306240380483, pretrained: 0.1450638990995491}
    tolerance: 1.0e-6
    on_failure: abort curation; no metrics.json
  secondary:
    - trained minus native_default, same bootstrap (budgets differ; descriptive)
    - per arm mean actions per frame, per-scale action counts, mean selected pixel-area fraction (all source-macro), coverage per unit area = source-macro coverage / source-macro area fraction
    - centre_at_area per native frame; report native minus centre_at_area (same bootstrap) alongside trained minus Center16 (GT1 +0.0813805)
    - per-source coverage table
  centre_at_area:
    definition: exact-area centred square with a uniformly fractional boundary ring. The frame centre lies between pixels 111 and 112, so centred pixel squares have even sides 2k. For union area A (pixels), k = largest integer with (2k)^2 <= A; coverage = M(2k) + f * (M(2k+2) - M(2k)), f = (A - (2k)^2) / ((2k+2)^2 - (2k)^2), where M(s) is the attention mass of the centred s x s pixel square. A = 4096 reproduces Center16 exactly.
resources:
  partition: NORMAL
  gres: "gpu:a40:1"  # attempt with gpu:1,VRAM:24G landed on a Pascal P6000 (sm_61), unsupported by the torch cu130 build
  cpus_per_task: 5
  host_memory_gib: 32
  max_walltime: "02:00:00"
  ceiling_walltime_hours: 4
  batch_size: 1  # see numerics
  num_workers: 4
numerics:
  dtype: float32 (checkpoint attn_mode sdpa; no autocast)
  cudnn_allow_tf32: false
  matmul_allow_tf32: false
  batch_size_rationale: >-
    Pre-submission smoke (8 test clips, RTX A2000): with cuDNN TF32 on, greedy
    Native-16 actions changed with batch size (logit near-ties); with TF32 off they did not.
    Native-default remained batch-dependent from frame 1 on even in FP32, because in
    batched generation a clip that has stopped keeps receiving padded slots that enter
    the KV cache with attention mask 1 and shift positions for its retained actions,
    whereas alone the frame ends and those tokens are re-encoded with padding masked.
    Batch size 1 gives every clip the selections it would receive alone and was
    run-to-run identical in the smoke. GT1 fine-only exports (batch 16, TF32 default)
    are reused as saved actions, unchanged.
