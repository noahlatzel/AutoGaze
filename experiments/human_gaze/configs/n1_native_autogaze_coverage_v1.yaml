arms:
  native16:
    role: primary comparator
    call: "model({'video': v}, max_gaze_tokens_each_frame=16, generate_only=True)"
    vocabulary: all 265 actions
    allow_eos: false  # EOS masked by NoEosTokenLogitsProcessor (also unconditional in upstream AutoGaze)
    task_loss_requirement: null  # max_gaze_tokens_each_frame disables stopping in AutoGaze.forward
    exact_actions_per_frame: 16
    decoding: greedy (model.eval -> do_sample=False), no repeats (NoRepeatTokensLogitsProcessor)
  native_default:
    role: secondary (descriptive)
    call: "model({'video': v}, gazing_ratio=0.75, task_loss_requirement=0.7, generate_only=True)"
    source_of_settings: NVILA-8B-HD-Video preprocessor_config.json gazing_ratio_tile=0.75, task_loss_requirement_tile=0.7 (equal to the checkpoint's fixed inference config)
    max_actions_per_frame: 198  # int(0.75 * 265)
    stopping: per multi-token block, positions whose predicted task loss <= 0.7 are replaced by EOS padding and the frame ends after that block; the first action of each frame is never dropped
    allow_eos: false
    decoding: greedy, no repeats
    target_scales: null  # NVILA passes target_scales for 392-px tiles (res-adapt into 224 sub-tiles); STAViS frames are 224 px, so the checkpoint's own 224 geometry applies
