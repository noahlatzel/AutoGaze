schema_version: 1
experiment_id: r2c_fixed_budget_scaling
budgets: [24, 36]
base_seeds: [440826, 440827, 440828]
continuation_seeds: [540826, 540827, 540828]
stage1_updates: 2315
stage2_updates: 7685
stage3_final_step: 17685
stage3_milestone_step: 12685
total_updates: 20000
validation_interval: 100
stage1_run_template: r2c_fixedk{budget}_stage1_seed{base_seed}
stage2_run_template: r2c_fixedk{budget}_stage2_base{base_seed}_seed{continuation_seed}
stage3_run_template: r2c_fixedk{budget}_stage3_base{base_seed}_seed{continuation_seed}
static_baselines: outputs/human_gaze/baselines/b1_fixed_budget_baselines_val.json
pretrained_template: outputs/human_gaze/baselines/pretrained_fixedk{budget}_val.json
pretrained_k16: experiments/human_gaze/results/m0_pretrained_exact16_fold1/metrics.json
reference_k16:
  base_seeds: [440826, 440827, 440828, 440829, 440830, 440831]
  stage3_run_template: r2b_fresh20k_stage3_base{base_seed}_seed{continuation_seed}
training:
  initialization: /storage/slurm/latn/data/AutoGaze/hf_models/nvidia--AutoGaze
  trainable: autoregressive_decoder_only
  frozen: [vision_encoder, connector, task_model]
  stage1:
    updates: 2315
    optimizer: adam
    learning_rate: 1.0e-5
    schedule: linear_w_warmup
    temperature: exponential_1.0_to_0.3
  stage2:
    updates: 7685
    optimizer: adam_reset
    learning_rate: 3.0e-6
    schedule: constant
    temperature: 0.3
  stage3:
    new_updates: 10000
    optimizer: adam_preserved
    learning_rate: 3.0e-6
    schedule: constant
    temperature: 0.3
  endpoint_selection: fixed_step_20000
diagnostics:
  checkpoints_cumulative: [10000, 15000, 20000]
  controls: [dynamic_policy, center_k, static_selection_frequency_topk, same_source_shuffled_video]
slurm:
  partition: NORMAL
  gpu_type: rtx_5000
  training_gpus: 6
