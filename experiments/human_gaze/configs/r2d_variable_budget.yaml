schema_version: 1
experiment_id: r2d_variable_fine_budget
base_seeds: [440826, 440827, 440828]
training_seeds: [640826, 640827, 640828]
run_template: r2d_variable_k16_base{base_seed}_seed{training_seed}
initial_checkpoint_template: outputs/human_gaze/grpo/r2b_fresh20k_stage3_base{base_seed}_seed{continuation_seed}/checkpoint_latest_gaze
fixed_k16_run_template: outputs/human_gaze/grpo/r2b_fresh20k_stage3_base{base_seed}_seed{continuation_seed}
total_updates: 20000
validation_interval: 100

dataset_root: /storage/user/zverev/datasets/av-gaze-stavis
manifest_path: outputs/human_gaze/d0_stavis_fold1_validated/clips.jsonl
cell_mass_path: outputs/human_gaze/d0_stavis_fold1_validated/cell_mass.npy
clip_len: 16
actions_per_frame: 265
fine_action_offset: 69
min_budget: 4
max_budget: 36
target_mean_budget: 16.0
matched_budget_min: 15.5
matched_budget_max: 16.5
batch_size: 8
num_workers: 4

calibration_clips_per_source: 8
calibration_seed: 200826
calibration_bias_min: -20.0
calibration_bias_max: 20.0
calibration_iterations: 10

training:
  initialization: matched_fixed_k16_20k_decoder
  trainable: autoregressive_decoder_only
  frozen: [vision_encoder, connector, task_model]
  optimizer: adam
  learning_rate: 3.0e-6
  schedule: constant
  temperature: exponential_1.0_to_0.3
  reward: coverage_minus_adaptive_linear_token_price
  initial_token_cost: 0.01
  dual_lr_per_grpo_batch: 1.0e-5
  dual_ema_decay: 0.95
  max_token_cost: 0.1
  endpoint_selection: fixed_step_20000

fixed_baselines: outputs/human_gaze/baselines/b1_fixed_budget_baselines_val.json
diagnostic_template: outputs/human_gaze/diagnostics/{run}/variable_budget_val.json

slurm:
  partition: NORMAL
  gpu_type: rtx_5000
  training_gpus: 3
  requested_memory_gb: 48
  diagnostics: sequential_in_each_seed_training_job
