schema_version: 1
experiment_id: r4_causal_connector_difference
preregistered_at: 2026-08-25
code_commit_before_implementation: 79af880
dataset:
  root: /storage/user/zverev/datasets/av-gaze-stavis
  manifest: outputs/human_gaze/d0_stavis_fold1_validated/clips.jsonl
  manifest_sha256: 0ef9fa17881517ea69d9edbaf57f8571c5c58d1da517370746fbe264fe33ff10
  cell_mass: outputs/human_gaze/d0_stavis_fold1_validated/cell_mass.npy
  cell_mass_sha256: fed5a6552ab94eeaa02a807959d4c3cda6de9dbadeadc35ee248e46ebc16dfb8
  design_split: train
  evaluation_split: val
  protected_split: test
  target_fps: 3.0
  clip_len: 16
architecture:
  budget: 16
  paired_base_seeds: [440826, 440827, 440828]
  training_seed_offset: 200000
  source_cumulative_updates: 20000
  continuation_updates: 10000
  validation_interval: 100
  learning_rate: 3.0e-6
  schedule: constant
  optimizer: adam_reset
  control: reuse_immutable_r3_control
  control_template: outputs/human_gaze/grpo/r3b_temporal_control_base{seed}_seed{training_seed}
  treatment: normalized_causal_connector_feature_difference_scalar_gate
  treatment_template: outputs/human_gaze/grpo/r4_causal_difference_base{seed}_seed{training_seed}
  formula: z_prime_t_i = z_t_i + gate * rms(z_t) * rmsnorm_frame(z_t_i - z_tminus1_i)
  first_frame_signal: zero
  normalization_axes: [spatial_tokens, hidden_channels]
  gate_initial_value: 0.0
  max_signal_to_feature_rms_ceiling: 0.25
  frozen: [vision_encoder, connector, task_model]
  unchanged: [decoder_architecture, reward, clip_len, sampling, exact_budget, group_size, temperature, preprocessing]
decision:
  primary_metric: paired_treatment_minus_r3_control_val_macro_k16_at_fixed_endpoint
  pass_min_delta: 0.005
  pass_min_positive_seed_pairs: 2
  fail_max_delta: 0.0
  fail_min_nonpositive_seed_pairs: 2
  material_source_collapse_definition: any_source_mean_paired_delta_at_most_minus_0.005
  require_dynamic_minus_static_positive_each_seed: true
  require_all_logged_signal_to_feature_rms_at_most: 0.25
  secondary:
    - matched_step_curve_auc
    - source_coverage
    - history_sensitivity
    - centroid_motion_error
    - dynamic_static_and_center_controls
    - treatment_minus_r3_position_descriptive_comparison
  prohibit_best_checkpoint_selection: true
  prohibit_test_evaluation: true
compute:
  partition: NORMAL
  gpu: rtx_5000
  treatment_jobs: 3
  max_wall_hours_per_job: 14
  max_total_treatment_gpu_hours: 42
  max_monitor_sleep_hours: 2
artifacts:
  run_template: outputs/human_gaze/grpo/r4_causal_difference_base{seed}_seed{training_seed}
  diagnostics_dir: outputs/human_gaze/r4_causal_difference_diagnostics
  result_dir: experiments/human_gaze/results/r4_causal_connector_difference
