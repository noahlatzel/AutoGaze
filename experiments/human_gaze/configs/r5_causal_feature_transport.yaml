schema_version: 1
experiment_id: r5_causal_feature_transport
preregistered_at: 2026-08-26
code_commit_before_implementation: d0c5463
dataset:
  root: /storage/user/zverev/datasets/av-gaze-stavis
  manifest: outputs/human_gaze/d0_stavis_fold1_validated/clips.jsonl
  manifest_sha256: 0ef9fa17881517ea69d9edbaf57f8571c5c58d1da517370746fbe264fe33ff10
  cell_mass: outputs/human_gaze/d0_stavis_fold1_validated/cell_mass.npy
  cell_mass_sha256: fed5a6552ab94eeaa02a807959d4c3cda6de9dbadeadc35ee248e46ebc16dfb8
  design_split: train
  evaluation_split: val
  protected_split: test
  target_fps: 3.0
  clip_len: 16
diagnostics:
  k16_seeds: [440826, 440827, 440828]
  continuation_seed_offset: 200000
  history_audit_frame_index: 15
  checkpoint_template: outputs/human_gaze/grpo/r5_feature_transport_base{seed}_seed{continuation_seed}/checkpoint_latest_gaze
architecture:
  budget: 16
  actions_per_frame: 265
  fine_action_offset: 69
  grid_size: 14
  paired_base_seeds: [440826, 440827, 440828]
  training_seed_offset: 200000
  source_cumulative_updates: 20000
  continuation_updates: 10000
  validation_interval: 100
  learning_rate: 3.0e-6
  schedule: constant
  optimizer: adam_reset
  control: reuse_immutable_r3_control
  treatment: causal_previous_gaze_feature_transport_logit_bias
  appearance_features: frozen_connector_features_minus_spatial_position
  previous_state: previous_frame_predicted_nonpadding_fine_actions
  correspondence: cosine_logsumexp
  correspondence_temperature: 0.1
  candidate_normalization: per_frame_zero_mean_unit_rms
  first_frame_bias: zero
  gate_initial_value: 0.0
  max_absolute_logit_gate: 1.0
  frozen: [vision_encoder, connector, task_model]
  unchanged: [decoder_architecture, reward, clip_len, sampling, exact_budget, group_size, training_temperature, preprocessing]
decision:
  primary_metric: paired_treatment_minus_r3_control_val_macro_k16_at_fixed_endpoint
  pass_min_delta: 0.005
  pass_min_positive_seed_pairs: 2
  fail_max_delta: 0.0
  fail_min_nonpositive_seed_pairs: 2
  material_source_collapse_definition: any_source_mean_paired_delta_at_most_minus_0.005
  require_dynamic_minus_static_positive_each_seed: true
  require_all_logged_absolute_logit_gates_at_most: 1.0
  secondary:
    - matched_step_curve_auc
    - source_coverage
    - motion_stratified_coverage
    - centroid_velocity_error
    - transport_top16_coverage_vs_same_coordinate_carryover
    - center_static_and_shuffled_controls
    - treatment_minus_r4_descriptive_comparison
  prohibit_best_checkpoint_selection: true
  prohibit_test_evaluation: true
compute:
  partition: NORMAL
  gpu: rtx_5000
  treatment_jobs: 3
  max_wall_hours_per_job: 14
  max_total_treatment_gpu_hours: 42
  max_monitor_sleep_hours: 2
artifacts:
  run_template: outputs/human_gaze/grpo/r5_feature_transport_base{seed}_seed{training_seed}
  diagnostics_dir: outputs/human_gaze/r5_feature_transport_diagnostics
  result_dir: experiments/human_gaze/results/r5_causal_feature_transport
