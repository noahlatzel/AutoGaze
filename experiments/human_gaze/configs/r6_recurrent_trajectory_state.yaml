schema_version: 1
experiment_id: r6_recurrent_trajectory_state
preregistered_at: 2026-08-27
code_commit_before_implementation: d6cdc58
dataset:
  root: /storage/user/zverev/datasets/av-gaze-stavis
  manifest: outputs/human_gaze/d0_stavis_fold1_validated/clips.jsonl
  manifest_sha256: 0ef9fa17881517ea69d9edbaf57f8571c5c58d1da517370746fbe264fe33ff10
  cell_mass: outputs/human_gaze/d0_stavis_fold1_validated/cell_mass.npy
  cell_mass_sha256: fed5a6552ab94eeaa02a807959d4c3cda6de9dbadeadc35ee248e46ebc16dfb8
  design_split: train
  evaluation_split: val
  protected_split: test
  target_fps: 3.0
  clip_len: 16
architecture:
  budget: 16
  actions_per_frame: 265
  fine_action_offset: 69
  grid_size: 14
  connector_hidden_dim: 192
  recurrent_hidden_dim: 192
  paired_base_seeds: [440826, 440827, 440828]
  training_seed_offset: 200000
  source_cumulative_updates: 20000
  continuation_updates: 10000
  validation_interval: 100
  learning_rate: 3.0e-6
  schedule: constant
  optimizer: adam_reset
  control: reuse_immutable_r3_control
  control_template: outputs/human_gaze/grpo/r3b_temporal_control_base{seed}_seed{training_seed}
  treatment: selection_conditioned_gru_state_action_logit_bias
  treatment_template: outputs/human_gaze/grpo/r6_recurrent_state_base{seed}_seed{training_seed}
  initial_state: zeros
  state_input: mean_completed_selected_frozen_connector_tokens
  update_order: once_after_completed_frame
  readout: bias_free_linear_hidden_to_196_then_zero_mean_unit_rms
  gate_initial_value: 0.0
  frozen: [vision_encoder, connector, task_model]
  unchanged: [decoder_architecture, reward, clip_len, sampling, exact_budget, group_size, training_temperature, preprocessing]
decision:
  primary_metric: paired_treatment_minus_r3_control_val_macro_k16_at_fixed_endpoint
  practical_effect_threshold: 0.005
  pass_min_delta: 0.005
  pass_min_positive_seed_pairs: 2
  fail_max_delta: 0.0
  fail_min_nonpositive_seed_pairs: 2
  material_source_collapse_definition: any_source_mean_paired_delta_at_most_minus_0.005
  center_collapse: any_seed_dynamic_minus_center_at_most_zero
  static_collapse: any_seed_dynamic_minus_learned_static_top16_at_most_zero
  shuffle_collapse: any_seed_dynamic_minus_same_source_shuffle_at_most_zero
  blind_copy_overlap_threshold: 0.95
  blind_copy_delta_over_control_threshold: 0.10
  inert_gate_threshold: 1.0e-4
  inert_normal_reset_jaccard_threshold: 0.999
  stability:
    require_all_finite: true
    max_absolute_gate: 1.0
    max_state_rms: 1.000001
    state_saturation_absolute_threshold: 0.99
    max_state_saturation_fraction: 0.25
  secondary:
    - matched_step_curve_auc_0_to_10000
    - per_source_coverage
    - recurrent_state_and_gate_stability
    - center_static_and_shuffled_controls
    - previous_frame_selection_overlap
    - same_coordinate_carryover_coverage
    - state_only_normal_reset_alternative_history_sensitivity
    - policy_and_ground_truth_centroid_displacement
    - centroid_velocity_error_train_p95_jsd_abrupt_transitions
    - motion_stratified_coverage
    - deterministic_noncenter_trajectory_visualizations
  prohibit_best_checkpoint_selection: true
  prohibit_test_evaluation: true
diagnostics:
  k16_seeds: [440826, 440827, 440828]
  continuation_seed_offset: 200000
  history_audit_frame_index: 15
  alternative_history: next_validation_clip_same_source_stable_manifest_order
  abrupt_transition: adjacent_target_jsd_at_least_pooled_train_p95
  motion_strata: frozen_r3_definition
  checkpoint_template: outputs/human_gaze/grpo/r6_recurrent_state_base{seed}_seed{continuation_seed}/checkpoint_latest_gaze
preflight:
  require_focused_unit_tests: true
  require_zero_gate_generation_identity: true
  require_zero_gate_rescoring_identity: true
  identity_validation_clips: one_per_source
  require_future_frame_invariance: true
  require_grpo_gradient_to_gate_and_recurrent_parameters: true
  require_finite_state_norms: true
  require_real_data_two_update_smoke: true
compute:
  partition: NORMAL
  gpu: rtx_5000
  treatment_jobs: 3
  max_wall_hours_per_job: 14
  max_total_r6_gpu_hours: 45
  max_monitor_sleep_hours: 2
artifacts:
  run_template: outputs/human_gaze/grpo/r6_recurrent_state_base{seed}_seed{training_seed}
  diagnostics_dir: outputs/human_gaze/r6_recurrent_state_diagnostics
  result_dir: experiments/human_gaze/results/r6_recurrent_trajectory_state
