id: hlvid_proxy_clean_s1
family: proxy_sampling
status: completed
question: Test first-wave thresholded proxy metrics against uniform HLVid/NVILA baselines.
runner: scripts/runners/evaluate_hlvid_proxy_sampling.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
outputs:
  root: outputs/hlvid/proxy_sampling
  summary_glob: clean_s1_*/*summary.json
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  selection: proxy
  tile_len: 16
  max_tiles_video: 1
  deltas: [1, 2, 4, 8, 16, 32, 64, 128, 192, 256, 320]
grid:
  sampling:
    - "128"
    - "256"
  proxy_grid:
    - proxy_metric: pixel_mse
      thresholds: [0.01, 0.02, 0.04]
    - proxy_metric: siglip
      thresholds: [0.006, 0.0125, 0.025]
    - proxy_metric: videomae_reconstruction
      thresholds: [2.0, 2.5, 3.0]
metrics:
  primary:
    - accuracy
    - mean_visited_tiles
    - mean_llm_inference_seconds
  secondary:
    - by_category
    - selected_delta_counts
    - proxy timing
notes:
  - research/hlvid_proxy_sampling_benchmark.md
launch_notes:
  - Historical thresholded runs are recorded for provenance only.
  - The current proxy evaluator uses score-minus-cost selection and does not accept --threshold.
runs:
  - id: clean_s1_pixel_mse_128_t001
    launchable: false
    status: completed
    output_dir: outputs/hlvid/proxy_sampling/clean_s1_pixel_mse_128_t001
    command:
      sampling: "128"
      proxy_metric: pixel_mse
      threshold: 0.01
  - id: clean_s1_pixel_mse_128_t002
    launchable: false
    status: completed
    output_dir: outputs/hlvid/proxy_sampling/clean_s1_pixel_mse_128_t002
    command:
      sampling: "128"
      proxy_metric: pixel_mse
      threshold: 0.02
  - id: clean_s1_pixel_mse_128_t004
    launchable: false
    status: completed
    output_dir: outputs/hlvid/proxy_sampling/clean_s1_pixel_mse_128_t004
    command:
