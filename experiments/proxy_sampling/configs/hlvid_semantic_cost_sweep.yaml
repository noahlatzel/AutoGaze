id: hlvid_semantic_cost_sweep
family: proxy_sampling
status: completed
question: Evaluate semantic proxy metrics under log temporal-cost sweeps.
runner: scripts/runners/evaluate_hlvid_proxy_sampling.py
environment: vila-autogaze-eval
dataset:
  name: hlvid
  root: /storage/slurm/latn/data/AutoGaze/HLVid
outputs:
  roots:
    - outputs/hlvid/proxy_sampling_v1_mtv1
    - outputs/hlvid/proxy_sampling_v2_cost_sweep_mtv1
    - outputs/hlvid/proxy_sampling_v3_semantic_mtv1
    - outputs/hlvid/proxy_sampling_v4_diversity_cosine_mtv1
command:
  dataset_root: /storage/slurm/latn/data/AutoGaze/HLVid
  sampling: "128"
  tile_len: 16
  max_tiles_video: 1
  temporal_cost: log
run_policy:
  type: explicit_completed_runs
  description: These are the saved completed summaries, not a Cartesian grid.
metrics:
  primary:
    - accuracy
    - mean_visited_tiles
    - mean_llm_inference_seconds
  secondary:
    - selected_delta_counts
    - mean_proxy_seconds_per_score
notes:
  - research/hlvid_semantic_proxy_metrics.md
  - research/hlvid_proxy_sampling_benchmark_v2_timing.md
runs:
  - id: proxy_sampling_v1_mtv1
    status: completed
    launchable: false
    output_dir: outputs/hlvid/proxy_sampling_v1_mtv1
    runs:
      - id: dinov2_semnovel_128_l001_log
        status: completed
        launchable: false
        output_dir: outputs/hlvid/proxy_sampling_v1_mtv1/dinov2_semnovel_128_l001_log
        command:
          selection: proxy
          proxy_metric: semantic_mean_novelty
          proxy_base_metric: pixel_mse
          semantic_model: dinov2
          lambda_cost: 0.01
      - id: pixel_mean_novelty_128_l001_log
        status: completed
        launchable: false
        output_dir: outputs/hlvid/proxy_sampling_v1_mtv1/pixel_mean_novelty_128_l001_log
        command:
          selection: proxy
          proxy_metric: mean_novelty
          proxy_base_metric: pixel_mse
          semantic_model: siglip
          lambda_cost: 0.01
      - id: siglip_qgain_128_l001_log
        status: completed
        launchable: false
        output_dir: outputs/hlvid/proxy_sampling_v1_mtv1/siglip_qgain_128_l001_log
        command:
          selection: proxy
          proxy_metric: siglip_qgain
          proxy_base_metric: pixel_mse
          semantic_model: siglip
          lambda_cost: 0.01
      - id: siglip_semnovel_128_l001_log
        status: completed
        launchable: false
        output_dir: outputs/hlvid/proxy_sampling_v1_mtv1/siglip_semnovel_128_l001_log
        command:
          selection: proxy
          proxy_metric: semantic_mean_novelty
          proxy_base_metric: pixel_mse
          semantic_model: siglip
          lambda_cost: 0.01
      - id: uniform_128
        status: completed
        launchable: false
        output_dir: outputs/hlvid/proxy_sampling_v1_mtv1/uniform_128
        command:
          selection: uniform
          sampling: "128"
  - id: proxy_sampling_v2_cost_sweep_mtv1
