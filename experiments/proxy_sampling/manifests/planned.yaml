version: 1
updated: "2026-06-24"
runs:
  - id: proxy_sampling_promote_dry_sweep_pareto_candidates
    status: planned
    question: Promote a small set of dry-sweep Pareto candidates to full NVILA evaluation.
    depends_on:
      - outputs/hlvid/proxy_dry_sweeps/full_128_log_fast/sweep_summary.jsonl
    metrics:
      - accuracy
      - mean_visited_tiles
      - mean_llm_inference_seconds
      - selected_delta_counts
  - id: proxy_sampling_v5_pareto_mtv48
    config: experiments/proxy_sampling/configs/hlvid_pareto_max_tiles48.yaml
    status: submitted
    question: Run the current accuracy-vs-token Pareto candidates with max_tiles_video=48.
    output_dir: outputs/hlvid/proxy_sampling_v5_pareto_mtv48
    depends_on:
      - experiments/proxy_sampling/configs/hlvid_semantic_cost_sweep.yaml
    metrics:
      - accuracy
      - mean_visited_frames
      - mean_visual_tokens_projected
      - mean_end_to_end_seconds
