analysis:
  primary_metric: question_micro_accuracy
  primary_contrast: stavis_center16 minus random16
  uncertainty: paired 77-video cluster bootstrap
  bootstrap_iterations: 10000
  bootstrap_seed: 20261107
  confidence_level: 0.90
  decision_rule:
    sensitive: 90% lower bound > 0 (structured Center16 above the random floor)
    random_better: 90% upper bound < 0
    inconclusive: otherwise; within-frame selection sensitivity not shown (no equivalence claim)
  secondary:
    - macro_video_accuracy difference (same bootstrap)
    - historical trained-K16 six-seed mean minus random16 (cross-job, cross-hardware, descriptive only)
    - answer-letter disagreement rates between arms, vs trained seeds, and Center16 rerun vs R2e Center16
    - thumbnails_only minus random16 (not run)
