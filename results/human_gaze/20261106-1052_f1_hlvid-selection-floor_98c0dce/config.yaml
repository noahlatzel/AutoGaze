schema_version: 1
experiment_id: f1_hlvid_selection_floor
gate: F1
title: Gaze HLVid selection floor
status: frozen_before_inference
date: 2026-11-06
authorization:
  user: Noah Latzel
  date: 2026-11-06
  scope: one bounded evaluation job (Random16 + Center16 rerun) plus dependent CPU curation
  training_authorized: false
  human_gaze_protected_test_accessed: false
question: >-
  Is HLVid question accuracy under frozen NVILA-8B-HD-Video (mtv48, 64 full
  thumbnails, exact fine-only K16) sensitive to within-frame selection at all?
  Compare the structured Center16 selection with a uniform-random K16 floor.
run_id_template: "YYYYMMDD-HHMM_f1_hlvid-selection-floor_<short-commit>"
arms:
  - id: random16
    policy_kind: random16
    policy_label: random16_uniform
    random_cells_seed: 20261106
    rule: >-
      for each (video_path, tile_index, frame_index) draw 16 distinct cells
      uniformly from the 196 tile-local 14x14 fine cells with an RNG seeded by
      sha256('f1-random-cells|seed|video_path|tile_index|frame_index');
      tile_index enumerates AutoGaze tile items in processor order within a question
    implementation: autogaze/human_gaze/random_cells.py
    injection_boundary: tile-local generation before resolution recovery (same as Center16)
    learned_generation_or_probability_rescoring: false
  - id: stavis_center16
    policy_kind: center16
    policy_label: stavis_center16
    rerun_of: r2e_hlvid_k16_causal_controls/stavis_center16 (unchanged code path)
    fine_cells_ordered: [90, 91, 104, 105, 76, 77, 89, 92, 103, 106, 118, 119, 75, 78, 117, 120]
  - id: thumbnails_only
    status: not_run
    reason: >-
      Zero high-resolution patches cannot be produced cleanly. Exact-K validation
      in the frozen adapter rejects zero actions; all-padded tiles or zero spatial
      tiles would require changing NVILA processor/model internals
      (token-padding strategy, TokenShuffle grouping, max_tiles_video>=1 tiling).
